name: glioma_subtyping
channels:
  - nvidia/label/cuda-11.8.0
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - pip=24.0
  # system libs
  - openslide=3.4.1
  - openslide-python=1.3.1
  # CUDA toolchain, only needed to compile the vendored Mamba kernels (mamba/)
  - cuda-nvcc=11.8.89
  - cuda-cudart-dev=11.8.89
  - cuda-libraries-dev=11.8.0
  - gxx_linux-64=11.4
  - ninja
  - setuptools=69.5.1
  - wheel
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.0.1+cu118
      - torchvision==0.15.2+cu118
      - -r requirements.txt
